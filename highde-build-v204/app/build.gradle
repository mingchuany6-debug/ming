plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tungee.amapbridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tungee.amapbridge'
        minSdk 26
        targetSdk 35
        versionCode 230
        versionName '2.3.0'
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Bundled Chinese Text Recognition V2 model: works immediately/offline after APK install.
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
