name: Build HighDe Hotel Helper APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'highde-build-v204/**'
      - '.github/workflows/highde-build-v204.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: highde-build-v204
        run: gradle --no-daemon assembleDebug
      - name: Prepare artifact
        run: cp highde-build-v204/app/build/outputs/apk/debug/app-debug.apk HighDe_Hotel_Helper_V2.2.1.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HighDe_Hotel_Helper_V2.2.1
          path: HighDe_Hotel_Helper_V2.2.1.apk
          if-no-files-found: error
