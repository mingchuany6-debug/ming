name: Build HighDe PC V2.3.0 OCR EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'highde-pc-v230/**'
      - '.github/workflows/highde-pc-v230.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name HighDe_Hotel_PC_V2.3.0_OCR highde-pc-v230/AMap_PC_Bridge_V230.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: HighDe_Hotel_PC_V2.3.0_OCR
          path: dist/HighDe_Hotel_PC_V2.3.0_OCR.exe
          if-no-files-found: error
